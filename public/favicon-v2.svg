<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outside the rounded square is transparent by design. -->
  <defs>
    <clipPath id="r"><rect width="100" height="100" rx="24"/></clipPath>
    <clipPath id="inner"><rect x="1.5" y="0" width="97" height="100"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="100" height="100" fill="#3A6EA5"/>
    <g clip-path="url(#inner)"><image href="data:image/png;base64," x="-1.2" y="-0.4" width="102.4" height="102" preserveAspectRatio="xMidYMid meet"/></g>
  </g>
</svg>